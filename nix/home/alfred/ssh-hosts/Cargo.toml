[package]
name = "ssh-hosts"
version = "0.1.0"
edition = "2024"

[dependencies]
color-eyre = "0.6"
fuzzy-matcher = "0.3.7"
glob = "0.3.3"
hashbrown = "0.17.1"
mimalloc = { version = "=0.1.48", default-features = false, features = ["v3"] }
nom = "8.0.0"
rayon = "1.12.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
